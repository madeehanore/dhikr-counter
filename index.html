<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d3a">
  <title>Dhikr Counter</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <main>
    <header class="reveal">
      <h1>Dhikr Counter</h1>
      <p id="today"></p>
      <div id="themes" role="group" aria-label="Choose theme"></div>
    </header>

    <section id="picker" class="reveal" aria-label="Choose dhikr"></section>

    <section id="counter" class="reveal">
      <p id="arabic" lang="ar" dir="rtl"></p>
      <p id="transliteration"></p>

      <div id="tapWrap">
        <svg id="ring" viewBox="0 0 260 260" aria-hidden="true">
          <circle class="track" cx="130" cy="130" r="120"/>
          <circle class="bar" id="bar" cx="130" cy="130" r="120"/>
        </svg>
        <button id="tap" aria-label="Tap to count">
          <span id="count">0</span>
          <span id="target">/ 33</span>
        </button>
      </div>

      <p id="status"></p>
    </section>

    <section id="controls" class="reveal">
      <button id="undo">Undo</button>
      <button id="reset">Reset</button>
      <label>
        Target
        <input id="targetInput" type="number" min="1" max="1000" value="33">
      </label>
      <label class="toggle">
        <input id="vibrate" type="checkbox" checked> Vibrate
      </label>
    </section>

    <section id="history" class="reveal">
      <h2>Recent days</h2>
      <ul id="historyList"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
